<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok authorization — Zabavne Kvizy</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:3rem auto;padding:0 1rem;color:#333;line-height:1.6}
h1{color:#4A2F1B}code{display:block;background:#f4f4f4;border-radius:8px;padding:1rem;word-break:break-all;font-size:1.1rem;margin:1rem 0}
button{background:#FF8A3D;color:#fff;border:0;border-radius:8px;padding:.7rem 1.4rem;font-size:1rem;cursor:pointer}</style>
</head><body>
<h1>🦉 TikTok authorization</h1>
<p id="msg">Reading authorization response…</p>
<code id="code"></code>
<button id="copy" hidden>Copy code</button>
<script>
const p = new URLSearchParams(location.search);
const code = p.get("code"), err = p.get("error");
const msg = document.getElementById("msg"), el = document.getElementById("code"),
      btn = document.getElementById("copy");
if (code) {
  msg.textContent = "Authorization successful. Paste this code into the terminal:";
  el.textContent = code;
  btn.hidden = false;
  btn.onclick = () => navigator.clipboard.writeText(code).then(() => btn.textContent = "Copied ✓");
} else {
  msg.textContent = err ? `Authorization failed: ${err} — ${p.get("error_description") || ""}`
                        : "No authorization code in the URL. Start the flow from the terminal.";
}
</script>
</body></html>
